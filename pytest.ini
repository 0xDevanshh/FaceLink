[pytest]
# The suite lives in tests/. The repo root also holds a few hand-run
# integration scripts named test_*.py that talk to a *live* server; without
# this, `pytest` from the root collected those (failing on connection refused)
# and their module names collided with tests/test_api.py.
testpaths = tests
norecursedirs = .venv .git evidence frontend node_modules .models samples scripts docs
